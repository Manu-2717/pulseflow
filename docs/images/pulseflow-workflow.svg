<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 130" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1f16"/>
      <stop offset="100%" stop-color="#142c1f"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b3829"/>
      <stop offset="100%" stop-color="#132a1e"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="920" height="130" rx="14" fill="url(#flowBg)" stroke="#22543d" stroke-width="1.5"/>

  <!-- Step 1: Capacity Radar -->
  <g transform="translate(24, 20)">
    <rect width="188" height="90" rx="10" fill="url(#cardGrad)" stroke="#2d6a4f" stroke-width="1.2" filter="url(#glow)"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#143b24" stroke="#4ade80" stroke-width="1"/>
    <!-- Radar Pulse Icon -->
    <circle cx="26" cy="26" r="4" fill="#4ade80"/>
    <circle cx="26" cy="26" r="8" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="2 2" fill="none"/>
    <text x="48" y="24" fill="#8ee6ae" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">01 · CAPACITY RADAR</text>
    <text x="48" y="36" fill="#ecfdf5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600">Know Who Has Room</text>
    <text x="14" y="62" fill="#a7f3d0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10.5">Tracks Free, Active, Blocked</text>
    <text x="14" y="78" fill="#6ee7b7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="500">teammates in real time</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <g transform="translate(220, 58)">
    <line x1="0" y1="7" x2="18" y2="7" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
    <path d="M14 2l6 5-6 5" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 2: Smart Dispatch -->
  <g transform="translate(250, 20)">
    <rect width="188" height="90" rx="10" fill="url(#cardGrad)" stroke="#2d6a4f" stroke-width="1.2" filter="url(#glow)"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#143b24" stroke="#38bdf8" stroke-width="1"/>
    <!-- Dispatch Routing Icon -->
    <path d="M20 30l6-8 6 8M26 22v10" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="24" fill="#7dd3fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">02 · SMART DISPATCH</text>
    <text x="48" y="36" fill="#ecfdf5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600">Send Work With Context</text>
    <text x="14" y="62" fill="#bae6fd" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10.5">Routes queued backlog items</text>
    <text x="14" y="78" fill="#7dd3fc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="500">by specialty &amp; current load</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <g transform="translate(446, 58)">
    <line x1="0" y1="7" x2="18" y2="7" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M14 2l6 5-6 5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 3: Fast Execution & Review Gates -->
  <g transform="translate(476, 20)">
    <rect width="188" height="90" rx="10" fill="url(#cardGrad)" stroke="#2d6a4f" stroke-width="1.2" filter="url(#glow)"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#143b24" stroke="#facc15" stroke-width="1"/>
    <!-- Check / Kanban Icon -->
    <path d="M19 26l5 5 8-10" stroke="#facc15" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="24" fill="#fde047" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">03 · FAST EXECUTION</text>
    <text x="48" y="36" fill="#ecfdf5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600">Optimistic Board &amp; Gates</text>
    <text x="14" y="62" fill="#fef08a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10.5">Zero-latency state transitions</text>
    <text x="14" y="78" fill="#fde047" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="500">with leader review gates</text>
  </g>

  <!-- Connector 3 -> 4 -->
  <g transform="translate(672, 58)">
    <line x1="0" y1="7" x2="18" y2="7" stroke="#facc15" stroke-width="2" stroke-linecap="round"/>
    <path d="M14 2l6 5-6 5" stroke="#facc15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 4: Blocker Spaces & AI Brief -->
  <g transform="translate(702, 20)">
    <rect width="194" height="90" rx="10" fill="url(#cardGrad)" stroke="#2d6a4f" stroke-width="1.2" filter="url(#glow)"/>
    <rect x="12" y="12" width="28" height="28" rx="6" fill="#143b24" stroke="#c084fc" stroke-width="1"/>
    <!-- Spark / AI Icon -->
    <path d="M26 19l2 4 4 2-4 2-2 4-2-4-4-2 4-2 2-4z" fill="#c084fc"/>
    <text x="48" y="24" fill="#d8b4fe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="700" letter-spacing="0.05em">04 · BLOCKER SPACES</text>
    <text x="48" y="36" fill="#ecfdf5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="600">AI Brief &amp; Solution</text>
    <text x="14" y="62" fill="#e9d5ff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10.5">Automated root cause brief,</text>
    <text x="14" y="78" fill="#d8b4fe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="10" font-weight="500">code patches &amp; pinned fixes</text>
  </g>
</svg>
