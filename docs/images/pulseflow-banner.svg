<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1f17"/>
      <stop offset="50%" stop-color="#142e20"/>
      <stop offset="100%" stop-color="#0a1710"/>
    </linearGradient>

    <!-- Mint Glow -->
    <radialGradient id="mintGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8ee6ae" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8ee6ae" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="tealGlow" cx="85%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <!-- Dotted Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8ee6ae" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="16" fill="url(#mintGlow)"/>
  <rect width="1200" height="360" rx="16" fill="url(#tealGlow)"/>
  <rect width="1200" height="360" rx="16" fill="url(#dotPattern)"/>
  <rect width="1200" height="360" rx="16" stroke="#22543d" stroke-width="2"/>

  <!-- Logo Mark Container -->
  <g transform="translate(80, 70)">
    <rect width="68" height="68" rx="16" fill="#1b4332" stroke="#8ee6ae" stroke-width="2"/>
    <path d="M22 34h8l5-12 8 24 5-12h8" stroke="#8ee6ae" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & Typography -->
  <g transform="translate(168, 72)">
    <text x="0" y="44" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="46" font-weight="800" letter-spacing="-0.04em">pulseflow</text>
    <rect x="220" y="16" width="94" height="26" rx="13" fill="#1b4332" stroke="#4ade80" stroke-width="1.2"/>
    <circle cx="233" cy="29" r="4" fill="#4ade80"/>
    <text x="243" y="33" fill="#8ee6ae" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="11" font-weight="700" letter-spacing="0.04em">V1.0 LIVE</text>
  </g>

  <!-- Tagline -->
  <text x="80" y="185" fill="#f0fdf4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="24" font-weight="600" letter-spacing="-0.02em">
    Self-hosted team task board with live capacity, smart dispatch &amp; focused blocker threads.
  </text>
  <text x="80" y="218" fill="#a7f3d0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="15" font-weight="400">
    Tactile paper UI • Optimistic execution • Built-in AI root cause analysis • Full planning suite with Gantt schedules
  </text>

  <!-- Badges Row -->
  <g transform="translate(80, 260)">
    <!-- Badge 1: Next.js 16 -->
    <rect x="0" y="0" width="100" height="34" rx="8" fill="#0f291e" stroke="#2d6a4f"/>
    <text x="50" y="21" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">Next.js 16</text>

    <!-- Badge 2: React 19 -->
    <rect x="110" y="0" width="96" height="34" rx="8" fill="#0f291e" stroke="#2d6a4f"/>
    <text x="158" y="21" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">React 19</text>

    <!-- Badge 3: TypeScript -->
    <rect x="216" y="0" width="112" height="34" rx="8" fill="#0f291e" stroke="#2d6a4f"/>
    <text x="272" y="21" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">TypeScript</text>

    <!-- Badge 4: PostgreSQL + Prisma -->
    <rect x="338" y="0" width="168" height="34" rx="8" fill="#0f291e" stroke="#2d6a4f"/>
    <text x="422" y="21" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">PostgreSQL + Prisma</text>

    <!-- Badge 5: Better Auth -->
    <rect x="516" y="0" width="112" height="34" rx="8" fill="#0f291e" stroke="#2d6a4f"/>
    <text x="572" y="21" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">Better Auth</text>

    <!-- Badge 6: Docker Ready -->
    <rect x="638" y="0" width="124" height="34" rx="8" fill="#0f291e" stroke="#2d6a4f"/>
    <text x="700" y="21" fill="#8ee6ae" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">Docker Ready</text>
  </g>
</svg>
